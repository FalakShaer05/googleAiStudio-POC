<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Creative System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .nav-tabs-container {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      margin: 2rem auto 0;
      max-width: 780px;
      overflow: hidden;
    }
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 2px solid #e9ecef;
      background: #f8f9ff;
      margin: 0;
    }
    .nav-tab {
      flex: 1 1 140px;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #667eea;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    a.nav-tab {
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-container {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      margin: 2rem auto;
      max-width: 780px;
    }
    .content-section { display: none; }
    .content-section.active { display: block; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-radius: 20px 20px 0 0;
      padding: 1.75rem;
      text-align: center;
    }
    .convert-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: #fff;
      padding: 0.9rem 1.5rem;
      border-radius: 25px;
      font-weight: 600;
      width: 100%;
    }
    .convert-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .status-message {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
    .preview-image {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #dee2e6;
    }
    #section-tracing-hand .preview-image {
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e9ecef 25%, transparent 25%),
        linear-gradient(-45deg, #e9ecef 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9ecef 75%),
        linear-gradient(-45deg, transparent 75%, #e9ecef 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
    }
    .download-btn {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      border: none;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip-wrap .form-check {
      margin: 0;
      padding: 0.25rem 0.65rem 0.25rem 1.7rem;
      background: #f8f9ff;
      border-radius: 20px;
      border: 1px solid #e9ecef;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  <script>
    window.CREATIVE_SYSTEM = {
      generateUrl: {{ url_for('creative_system.generate') | tojson }},
      downloadPrefix: "/download/"
    };
  </script>
  <script src="{{ url_for('creative_system.static', filename='js/app.js') }}?v=regen2"></script>
</body>
</html>
